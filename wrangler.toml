# WonderWorld — Cloudflare Pages configuration
#
# Local development with the signup endpoint working:
#   npx wrangler pages dev . --kv SUBSCRIBERS
#
# Deploy from the command line (alternative to the Git integration):
#   npx wrangler pages deploy . --project-name wonderworld

name = "wonderworld"
compatibility_date = "2026-10-06"
pages_build_output_dir = "."

# Bind the KV namespace that stores family-beta signups.
# Create it once:  npx wrangler kv namespace create wonderworld-subscribers
# then paste the returned id below (or bind it in the dashboard instead).
# [[kv_namespaces]]
# binding = "SUBSCRIBERS"
# id = "paste-your-namespace-id-here"
